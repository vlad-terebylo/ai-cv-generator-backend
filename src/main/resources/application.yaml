spring:
  application:
    name: AiCvGenerator
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

cv:
  import:
    pool-size: 4
    queue-capacity: 20
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    base-url: https://generativelanguage.googleapis.com/v1beta
